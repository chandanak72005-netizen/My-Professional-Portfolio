<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chandana | Portfolio</title>

<style>
    /* ---------- BASE STYLES ---------- */
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        color: white;
        background: #000;
        transition: 0.3s ease;
    }

    /* ---------- NAVBAR ---------- */
    nav {
        width: 100%;
        padding: 15px 30px;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(10px);
        position: fixed;
        top: 0;
        left: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 0 15px rgba(255,255,255,0.1);
    }

    nav h2 {
        font-size: 22px;
        font-weight: bold;
        margin: 0;
    }

    nav ul {
        display: flex;
        gap: 25px;
        list-style: none;
        margin: 0;
        padding: 0;
    }

    nav ul li a {
        color: white;
        text-decoration: none;
        font-size: 18px;
        transition: 0.3s;
    }

    nav ul li a:hover {
        opacity: 0.7;
    }

    /* ---------- THEME TOGGLE BUTTON ---------- */
    #themeToggle {
        background: white;
        color: black;
        border: none;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        transition: 0.3s;
    }


    /* ---------- MAIN CONTAINER ---------- */
    .container {
        width: 90%;
        max-width: 600px;
        margin: 130px auto 0;
        background: rgba(255,255,255,0.05);
        padding: 40px;
        border-radius: 25px;
        backdrop-filter: blur(14px);
        box-shadow: 0 0 25px rgba(255,255,255,0.12);
        text-align: center;
        opacity: 0;
        transform: translateY(40px);
        animation: fadeIn 1s forwards;
    }

    h1 {
        font-size: 42px;
        margin-bottom: 10px;
        font-weight: bold;
    }

    p {
        font-size: 18px;
        opacity: 0.75;
        margin-bottom: 40px;
    }

    /* ---------- BUTTONS ---------- */
    .btn {
        display: block;
        width: 80%;
        margin: 15px auto;
        padding: 15px;
        border-radius: 12px;
        font-size: 20px;
        text-decoration: none;
        color: white;
        font-weight: bold;
        background: linear-gradient(90deg, #007bff, #00d4ff);
        transition: 0.3s;
    }

    .btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px #00d4ff;
    }

    footer {
        margin-top: 25px;
        font-size: 14px;
        opacity: 0.4;
    }

    /* ---------- FADE ANIMATIONS ---------- */
    @keyframes fadeIn {
        100% {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* ---------- LIGHT MODE ---------- */
    .light {
        background: #f8f8f8;
        color: #111;
    }

    .light nav {
        background: rgba(0,0,0,0.05);
    }

    .light .container {
        background: rgba(0,0,0,0.1);
        box-shadow: none;
    }

    .light .btn {
        color: black;
    }

    .light #themeToggle {
        background: black;
        color: white;
    }

</style>

</head>
<body>

<!-- 🔹 NAVBAR -->
<nav>
    <h2>Chandana</h2>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="resume/index.html" target="_blank">Resume</a></li>
        <li><a href="biodata/index.html" target="_blank">Biodata</a></li>
    </ul>

    <button id="themeToggle">🌙</button>
</nav>


<!-- 🔹 MAIN CONTENT -->
<div class="container fade-in">
    <h1>Chandana K</h1>
    <p>B.Tech CSE | Developer | Tech Enthusiast</p>

    <a href="resume/index.html" target="_blank" class="btn">📄 View Resume</a>
    <a href="biodata/index.html" target="_blank" class="btn" style="background:linear-gradient(90deg,#00ff88,#0affc6)">👤 View Biodata</a>

    <footer>© 2025 Chandana | Portfolio</footer>
</div>


<!-- 🔹 SCRIPT (THEME TOGGLE + ANIMATIONS) -->
<script>
    const toggle = document.getElementById("themeToggle");

    toggle.addEventListener("click", () => {
        document.body.classList.toggle("light");

        if (document.body.classList.contains("light")) {
            toggle.textContent = "🌙"; // switch to dark
        } else {
            toggle.textContent = "☀"; // switch to light
        }
    });
</script>


</body>
</html>
